<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>spotcode-sns</title>
  <script>
    // spa-github-pages style redirect: rewrite /spotcode-sns/<path>
    // to /spotcode-sns/?/<path> so index.html can restore it.
    // segmentCount = 1 for project pages (the "spotcode-sns" segment).
    (function () {
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }());
  </script>
</head>
<body></body>
</html>
