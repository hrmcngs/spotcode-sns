name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp deploy SHA into service worker
        # Replaces the __BUILD_SHA__ placeholder in src/sw.js with the
        # short commit hash so every deploy gets a unique CACHE key and
        # PRs never have to bump it (which used to cause sw.js conflicts
        # on every parallel branch).
        run: |
          sha=$(git rev-parse --short HEAD)
          sed -i "s/__BUILD_SHA__/${sha}/" src/sw.js
          grep '^const CACHE' src/sw.js
      - name: Upload static site artifact (src/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: src
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
